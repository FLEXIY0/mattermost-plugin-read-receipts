name: Release

# Tag the release commit and push the tag:
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag is the source of truth for the version, and the job refuses to publish
# unless every place the version is duplicated already agrees with it.
on:
  push:
    tags:
      - 'v*'
      # A bare version tag works too, so `1.2.1` is not silently ignored.
      - '[0-9]*'
  # Publishing a release in the web UI creates the tag and the release
  # together. That normally also fires the tag push above, but this makes the
  # web flow work either way; the publish step below is idempotent, so a double
  # run just re-uploads the same files.
  release:
    types: [published]
  # The whole release from the Actions tab: fill in the tag and this creates it,
  # builds and publishes. Left empty it only builds and uploads the bundles as
  # workflow artifacts, so the pipeline can be exercised without publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.4.0. Leave empty to build only.'
        required: false
        type: string

# Never let two runs for the same tag upload assets at the same time.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PLUGIN_ID: com.github.mattermost-message-status

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            release)           tag="${RELEASE_TAG}" ;;
            push)              tag="${GITHUB_REF_NAME}" ;;
            workflow_dispatch) tag="$(echo "${INPUT_TAG:-}" | tr -d '[:space:]')" ;;
            *)                 tag="" ;;
          esac

          # Catch a typo before anything is created, rather than leaving a bad
          # tag and release behind to be cleaned up by hand.
          if [ -n "${tag}" ] && ! printf '%s' "${tag}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'${tag}' is not a version tag. Expected something like v1.4.0 or 1.4.0-rc1."
            exit 1
          fi

          if [ -n "${tag}" ]; then
            # Accepts both v1.2.1 and 1.2.1.
            version="${tag#v}"
          else
            version="$(jq -r .version plugin.json)"
          fi

          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "Building version ${version}${tag:+ for tag ${tag}}"

      # The version lives in four files and Mattermost will either refuse the
      # upgrade or serve a stale webapp bundle if they drift apart, so this is a
      # hard gate rather than a warning.
      - name: Check the version is consistent
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.version }}'
          status=0

          check() {
            if [ "$2" != "${version}" ]; then
              echo "::error file=$1::$1 declares '$2', expected '${version}'"
              status=1
            fi
          }

          check plugin.json          "$(jq -r .version plugin.json)"
          check plugin.full.json     "$(jq -r .version plugin.full.json)"
          check Makefile             "$(sed -n 's/^PLUGIN_VERSION := //p' Makefile)"
          check webapp/src/manifest.ts \
            "$(sed -n "s/^[[:space:]]*version: '\(.*\)',$/\1/p" webapp/src/manifest.ts)"

          if [ "${status}" -ne 0 ]; then
            echo "Bump the version in every file above before tagging." >&2
            exit 1
          fi
          echo "All four declarations agree on ${version}."

      # Lockfile-exact install. `make webapp` runs `npm install`, which may
      # resolve differently; seeding node_modules first makes the released
      # bundle reproducible from package-lock.json.
      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Check
        run: make check

      # `make dist` and `make dist-all` write the same filename but different
      # bundles (dist ships plugin.json / linux only, dist-all ships
      # plugin.full.json / every platform), so each is moved aside before the
      # next build overwrites it.
      - name: Build the Linux bundle
        run: |
          set -euo pipefail
          make dist
          mv "dist/${PLUGIN_ID}-${VERSION}.tar.gz" "dist/${PLUGIN_ID}-${VERSION}-linux.tar.gz"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build the all-platforms bundle
        run: make dist-all

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum ./*.tar.gz | sed 's| \./| |' >SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-bundles-${{ steps.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish the release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          assets=(
            "dist/${PLUGIN_ID}-${VERSION}-linux.tar.gz"
            "dist/${PLUGIN_ID}-${VERSION}.tar.gz"
            dist/SHA256SUMS
          )

          # Creating a release from the web UI makes the tag and the release in
          # one step, so by the time this runs the release can already exist.
          # Attach the bundles to it instead of failing, and leave the notes
          # whoever wrote them alone.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; attaching the bundles to it."
            gh release upload "${TAG}" --clobber "${assets[@]}"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Publishing a release for the existing tag ${TAG}."
          else
            echo "Creating tag ${TAG} at ${GITHUB_SHA} and publishing it."
          fi

          # A tag like v1.2.0-rc1 is a prerelease.
          prerelease=''
          case "${VERSION}" in
            *-*) prerelease='--prerelease' ;;
          esac

          cat >notes.md <<NOTES
          ## Install

          Download \`${PLUGIN_ID}-${VERSION}-linux.tar.gz\`, then:

          \`\`\`bash
          mmctl plugin upload ${PLUGIN_ID}-${VERSION}-linux.tar.gz
          mmctl plugin enable ${PLUGIN_ID}
          \`\`\`

          Or upload it in **System Console → Plugins → Plugin Management** and
          enable **Message Status**. Reload the web client afterwards.

          | Asset | Contents |
          | --- | --- |
          | \`${PLUGIN_ID}-${VERSION}-linux.tar.gz\` | linux amd64 + arm64 — use this one |
          | \`${PLUGIN_ID}-${VERSION}.tar.gz\` | also macOS + Windows; larger, may need a higher \`FileSettings.MaxFileSize\` |
          | \`SHA256SUMS\` | checksums for both bundles |

          NOTES

          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file notes.md \
            --generate-notes \
            ${prerelease} \
            "${assets[@]}"
